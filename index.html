<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saraunh0ly — кто под шлемом?</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#fff;color:#000;font-family:'Inter',system-ui,sans-serif}
  .stage{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px}
  .frame{position:relative;width:min(90vw,1080px);aspect-ratio:1280/714;border-radius:20px;overflow:background:#fff;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
  .frame .face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
  canvas#veil{position:absolute;inset:0}
  .hint{position:absolute;top:4%;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#666;background:#f0f0f0;padding:8px 16px;border-radius:999px}
  .signature{position:absolute;right:4%;bottom:5%;font-family:'Great Vibes',cursive;font-size:72px;color:#22aa44;text-decoration:none;text-transform:none;line-height:1;pointer-events:none}
  .sig-green{color:#22aa44}
  .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
  .sound-btn{background:#eee;border:1px solid #ccc;border-radius:999px;padding:8px 16px;font-size:12px;letter-spacing:1px;text-transform:lowercase;cursor:pointer}
  .sound-btn.playing{border-color:#22aa44;color:#22aa44}
  .eq{display:flex;gap:3px;height:12px;align-items:flex-end}
  .eq i{width:2px;border-radius:2px;background:#22aa44;height:3px;opacity:0.5}
  .eq.playing i{opacity:1;animation:eq 0.6s infinite}
  @keyframes eq{0%,100%{height:3px;opacity:0.5}50%{height:12px;opacity:1}}
  .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#888}
  .ver{font-size:10px;color:#aaa}
</style>
</head>
<body>
<div class="stage">
  <div class="frame" id="frame">
    <img class="face" src="face.jpg" alt="гонщик">
    <canvas id="veil" aria-hidden="true"></canvas>
    <div class="hint">води курсором по шлему</div>
    <div class="signature sig-green">Saraunh0ly</div>
  </div>

  <div class="bar">
    <button class="sound-btn" id="soundBtn" aria-label="Включить звук">
      <span class="eq"><i></i><i></i><i></i><i></i></span>
      <span id="soundLabel">включить звук</span>
    </button>
    <span class="tag">наведи — увидишь, кто под шлемом</span>
    <span class="ver">v11</span>
  </div>
</div>

<audio id="audio" src="song.m4a" loop preload="auto"></audio>
<script src="app.js?v=11"></script>
</body>
</html>
